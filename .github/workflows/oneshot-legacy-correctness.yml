name: One-shot legacy correctness patch

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/bible-bot-legacy-correctness' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/bible-bot-legacy-correctness
          fetch-depth: 0

      - name: Patch only audited legacy handlers
        run: python .github/scripts/oneshot_legacy_patch.py

      - name: Guard patch scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only)" = "bot.py"
          grep -q '"nero", "geography"' bot.py
          grep -q 'claim_battle_opponent' bot.py
          grep -q 'persisted_role = battle_role_for_user' bot.py
          grep -q 'delete_battle_for_participant' bot.py
          if grep -A35 '^async def join_battle' bot.py | grep -q 'update_battle(battle_id'; then
            echo 'join_battle still contains non-atomic update_battle' >&2
            exit 1
          fi

      - name: Commit exact legacy patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.py
          git commit -m "fix: harden legacy random and battle flows"
          git push origin HEAD:agent/bible-bot-legacy-correctness
