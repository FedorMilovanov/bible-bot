name: One-shot battle delivery patch

on:
  push:
    branches: [agent/bible-bot-battle-consistency]
    paths:
      - .github/workflows/patch-battle-delivery.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/bible-bot-battle-consistency
          persist-credentials: true
          fetch-depth: 0
      - name: Apply exact byte replacements
        shell: python
        run: |
          from pathlib import Path
          path = Path("bot.py")
          original = path.read_bytes()
          nl = b"\r\n" if b"\r\n" in original else b"\n"
          def b(text):
              return text.replace("\n", nl.decode()).encode()
          replacements = [
              (
                  b('''from battle_consistency import (\n    apply_battle_reward_once, battle_role_for_user,\n    cancel_battle_for_participant, claim_battle_finalization,\n    get_battles_needing_finalization, join_battle_atomic,\n    record_battle_finish_atomic,\n)'''),
                  b('''from battle_consistency import (\n    apply_battle_reward_once, battle_role_for_user,\n    cancel_battle_for_participant, claim_battle_finalization,\n    delete_battle_if_fully_delivered, get_battles_needing_finalization,\n    join_battle_atomic, mark_battle_result_delivered,\n    record_battle_finish_atomic,\n)'''),
              ),
              (
                  b('''    # Гарантированно отправляем обоим — каждый получит в свой личный чат\n    for uid in (battle["creator_id"], battle["opponent_id"]):\n        try:\n            await bot.send_message(\n                chat_id=uid,\n                text=text,\n                reply_markup=keyboard,\n                parse_mode="Markdown",\n            )\n        except Exception as e:\n            logger.warning("Battle result delivery to %s failed: %s", uid, e)\n\n    delete_battle(battle_id)'''),
                  b('''    delivery_pending = False\n    for role, uid in (\n        ("creator", battle["creator_id"]),\n        ("opponent", battle["opponent_id"]),\n    ):\n        if battle.get(f"{role}_result_delivered") is True:\n            continue\n        try:\n            await bot.send_message(\n                chat_id=uid,\n                text=text,\n                reply_markup=keyboard,\n                parse_mode="Markdown",\n            )\n        except Exception as e:\n            logger.warning("Battle result delivery to %s failed: %s", uid, e)\n            delivery_pending = True\n            continue\n\n        if not mark_battle_result_delivered(battle_id, uid, role):\n            logger.warning(\n                "Battle %s delivery receipt for %s could not be persisted",\n                battle_id, uid,\n            )\n            delivery_pending = True\n\n    if delivery_pending:\n        return\n    if not delete_battle_if_fully_delivered(battle_id):\n        logger.warning("Battle %s final delete deferred for retry", battle_id)'''),
              ),
          ]
          current = original
          for old, new in replacements:
              if current.count(old) != 1:
                  raise SystemExit(f"source block count={current.count(old)}")
              if new in current:
                  raise SystemExit("replacement already present")
              current = current.replace(old, new, 1)
          reverse = current
          for old, new in reversed(replacements):
              if reverse.count(new) != 1:
                  raise SystemExit("replacement uniqueness failed")
              reverse = reverse.replace(new, old, 1)
          if reverse != original:
              raise SystemExit("reverse replacement did not reproduce original bytes")
          path.write_bytes(current)
      - name: Verify patch scope
        run: |
          test "$(git diff --name-only)" = "bot.py"
          grep -F 'mark_battle_result_delivered(battle_id, uid, role)' bot.py
          grep -F 'delete_battle_if_fully_delivered(battle_id)' bot.py
          grep -F 'if battle.get(f"{role}_result_delivered") is True:' bot.py
      - name: Commit exact delivery integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.py
          git commit -m "Retry incomplete PvP result delivery"
          git push origin HEAD:agent/bible-bot-battle-consistency
