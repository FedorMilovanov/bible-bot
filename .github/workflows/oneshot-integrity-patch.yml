name: One-shot integrity patch

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/bible-bot-legacy-correctness' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/bible-bot-legacy-correctness
          fetch-depth: 0

      - name: Patch audited authorization and finalization regions
        run: python .github/scripts/oneshot_integrity_patch.py

      - name: Guard patch scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only)" = "bot.py"
          grep -q 'get_owned_quiz_session(session_id, user_id)' bot.py
          grep -q 'cancel_owned_quiz_session(session_id, user_id)' bot.py
          grep -q 'target_id != user_id' bot.py
          grep -q 'record_battle_result(' bot.py
          grep -q 'claim_final_battle(battle_id)' bot.py
          grep -q 'battle_result_pending' bot.py
          if grep -q 'await show_battle_results(bot, battle_id)' bot.py; then
            echo 'legacy non-claimed result delivery remains' >&2
            exit 1
          fi

      - name: Commit exact integrity patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.py
          git commit -m "fix: enforce session ownership and battle finalization"
          git push origin HEAD:agent/bible-bot-legacy-correctness
