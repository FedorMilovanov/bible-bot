name: One-shot battle recovery patch

on:
  push:
    branches: [agent/bible-bot-battle-consistency]
    paths:
      - .github/workflows/patch-battle-recovery.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/bible-bot-battle-consistency
          persist-credentials: true
          fetch-depth: 0
      - name: Apply exact byte replacements
        shell: python
        run: |
          from pathlib import Path
          path = Path("bot.py")
          original = path.read_bytes()
          nl = b"\r\n" if b"\r\n" in original else b"\n"
          def b(text):
              return text.replace("\n", nl.decode()).encode()
          replacements = [
              (
                  b('''from battle_consistency import (\n    apply_battle_reward_once, battle_role_for_user,\n    cancel_battle_for_participant, join_battle_atomic,\n    record_battle_finish_atomic,\n)'''),
                  b('''from battle_consistency import (\n    apply_battle_reward_once, battle_role_for_user,\n    cancel_battle_for_participant, claim_battle_finalization,\n    get_battles_needing_finalization, join_battle_atomic,\n    record_battle_finish_atomic,\n)'''),
              ),
              (
                  b('''async def show_battle_results(bot, battle_id: str):\n    """\n    Формирует итоговый текст и отправляет его ОБОИМ участникам через context.bot.\n    Вызывается только когда creator_finished и opponent_finished == True.\n    """\n    battle = get_battle(battle_id)\n    if not battle:\n        return'''),
                  b('''async def show_battle_results(bot, battle_id: str):\n    """\n    Формирует итоговый текст и отправляет его ОБОИМ участникам через context.bot.\n    Вызывается только когда creator_finished и opponent_finished == True.\n    """\n    battle = claim_battle_finalization(battle_id)\n    if not battle:\n        return'''),
              ),
              (
                  b('''    if winner == "creator":\n        apply_battle_reward_once(battle["creator_id"], battle_id, "win")\n        apply_battle_reward_once(battle["opponent_id"], battle_id, "lose")\n    elif winner == "opponent":\n        apply_battle_reward_once(battle["creator_id"], battle_id, "lose")\n        apply_battle_reward_once(battle["opponent_id"], battle_id, "win")\n    else:\n        apply_battle_reward_once(battle["creator_id"], battle_id, "draw")\n        apply_battle_reward_once(battle["opponent_id"], battle_id, "draw")'''),
                  b('''    if winner == "creator":\n        reward_results = (\n            apply_battle_reward_once(battle["creator_id"], battle_id, "win"),\n            apply_battle_reward_once(battle["opponent_id"], battle_id, "lose"),\n        )\n    elif winner == "opponent":\n        reward_results = (\n            apply_battle_reward_once(battle["creator_id"], battle_id, "lose"),\n            apply_battle_reward_once(battle["opponent_id"], battle_id, "win"),\n        )\n    else:\n        reward_results = (\n            apply_battle_reward_once(battle["creator_id"], battle_id, "draw"),\n            apply_battle_reward_once(battle["opponent_id"], battle_id, "draw"),\n        )\n\n    if any(result.retryable_error for result in reward_results):\n        logger.warning("Battle %s reward finalization deferred for retry", battle_id)\n        return\n    for uid, result in zip(\n        (battle["creator_id"], battle["opponent_id"]), reward_results\n    ):\n        if result.missing_user:\n            logger.error("Battle %s reward target user %s is missing", battle_id, uid)'''),
              ),
              (
                  b('''async def cleanup_old_battles_job(context):\n    """JobQueue: удаляет устаревшие битвы из MongoDB."""\n    deleted = db_cleanup_stale_battles()\n    if deleted:\n        logger.info("🧹 Удалено устаревших битв: %d", deleted)'''),
                  b('''async def cleanup_old_battles_job(context):\n    """JobQueue: восстанавливает финализацию и удаляет устаревшие битвы."""\n    pending = await asyncio.to_thread(get_battles_needing_finalization)\n    for battle_id in pending:\n        try:\n            await show_battle_results(context.bot, battle_id)\n        except Exception as exc:\n            logger.warning("Battle %s recovery failed: %s", battle_id, exc)\n\n    deleted = await asyncio.to_thread(db_cleanup_stale_battles)\n    if deleted:\n        logger.info("🧹 Удалено устаревших битв: %d", deleted)'''),
              ),
          ]
          current = original
          for old, new in replacements:
              if current.count(old) != 1:
                  raise SystemExit(f"source block count={current.count(old)}")
              if new in current:
                  raise SystemExit("replacement already present")
              current = current.replace(old, new, 1)
          reverse = current
          for old, new in reversed(replacements):
              if reverse.count(new) != 1:
                  raise SystemExit("replacement uniqueness failed")
              reverse = reverse.replace(new, old, 1)
          if reverse != original:
              raise SystemExit("reverse replacement did not reproduce original bytes")
          path.write_bytes(current)
      - name: Verify patch scope
        run: |
          test "$(git diff --name-only)" = "bot.py"
          grep -F 'battle = claim_battle_finalization(battle_id)' bot.py
          grep -F 'pending = await asyncio.to_thread(get_battles_needing_finalization)' bot.py
          grep -F 'if any(result.retryable_error for result in reward_results):' bot.py
      - name: Commit exact recovery integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.py
          git commit -m "Recover interrupted PvP finalization"
          git push origin HEAD:agent/bible-bot-battle-consistency
