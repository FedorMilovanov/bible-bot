name: One-shot callback robustness

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/bible-bot-legacy-correctness' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/bible-bot-legacy-correctness
          fetch-depth: 0
      - name: Patch audited callback regions
        run: python .github/scripts/oneshot_callback_robustness.py
      - name: Guard patch scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only)" = "bot.py"
          grep -q 'report_type not in REPORT_TYPE_LABELS' bot.py
          grep -q 'q_index < 0 or q_index >= len(answered)' bot.py
          grep -q 'report_inaccuracy_' bot.py
          grep -q 'Нет доступа к чужому разбору ошибок' bot.py
      - name: Commit exact callback patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.py
          git commit -m "fix: harden legacy callback parsing and reporting"
          git push origin HEAD:agent/bible-bot-legacy-correctness
