name: One-shot battle boundary patch

on:
  push:
    branches: [agent/bible-bot-battle-consistency]
    paths:
      - .github/workflows/patch-battle-boundaries.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/bible-bot-battle-consistency
          persist-credentials: true
          fetch-depth: 0
      - name: Apply exact byte replacements
        shell: python
        run: |
          from pathlib import Path
          path = Path("bot.py")
          original = path.read_bytes()
          nl = b"\r\n" if b"\r\n" in original else b"\n"
          def b(text):
              return text.replace("\n", nl.decode()).encode()
          replacements = [
              (
                  b('from battle_consistency import apply_battle_reward_once, join_battle_atomic'),
                  b('''from battle_consistency import (\n    apply_battle_reward_once, battle_role_for_user,\n    cancel_battle_for_participant, join_battle_atomic,\n    record_battle_finish_atomic,\n)'''),
              ),
              (
                  b('''    battle = get_battle(battle_id)\n    if not battle:\n        await query.edit_message_text("❌ Битва не найдена.")\n        return\n\n    user_data[user_id] = _create_session_data('''),
                  b('''    battle = get_battle(battle_id)\n    if not battle:\n        await query.edit_message_text("❌ Битва не найдена.")\n        return\n\n    actual_role = battle_role_for_user(battle, user_id)\n    if actual_role is None or role != actual_role:\n        await query.edit_message_text("❌ Эта кнопка не относится к вашей роли в битве.")\n        return\n\n    user_data[user_id] = _create_session_data('''),
              ),
              (
                  b('''    try:\n        idx = int(query.data.replace("ba_", ""))\n        current_options = data.get("current_options", [])\n        if idx >= len(current_options):\n            await query.answer()\n            return\n\n        q_num        = data["current_question"]\n        q            = data["questions"][q_num]\n        user_answer  = current_options[idx]\n        correct_text = data.get("current_correct_text") or q["options"][q["correct"]]\n\n        sent_at     = data.get("question_sent_at", time.time())\n        elapsed     = min(time.time() - sent_at, 7.0)\n\n        if user_answer == correct_text:\n            data["correct_answers"] += 1\n            speed_bonus = round((7.0 - elapsed) / 7.0 * 7)\n            points = 10 + speed_bonus\n            data["battle_points"] = data.get("battle_points", 0) + points\n            await query.answer(f"✅ +{points} очков (⚡{speed_bonus} бонус)", show_alert=False)\n        else:\n            await query.answer(f"❌ Верно: {correct_text}", show_alert=True)\n\n        data["current_question"] += 1\n    finally:\n        data["processing_answer"] = False\n\n    if data["current_question"] < len(data["questions"]):\n        await send_battle_question(context.bot, chat_id, user_id)\n    else:\n        await finish_battle_for_user(context.bot, chat_id, user_id)'''),
                  b('''    try:\n        idx = int(query.data.replace("ba_", ""))\n        current_options = data.get("current_options", [])\n        if idx >= len(current_options):\n            await query.answer()\n            return\n\n        q_num = data["current_question"]\n        if q_num >= len(data["questions"]):\n            await query.answer()\n            await finish_battle_for_user(context.bot, chat_id, user_id)\n            return\n\n        q = data["questions"][q_num]\n        user_answer = current_options[idx]\n        correct_text = data.get("current_correct_text") or q["options"][q["correct"]]\n\n        sent_at = data.get("question_sent_at", time.time())\n        elapsed = min(time.time() - sent_at, 7.0)\n\n        if user_answer == correct_text:\n            data["correct_answers"] += 1\n            speed_bonus = round((7.0 - elapsed) / 7.0 * 7)\n            points = 10 + speed_bonus\n            data["battle_points"] = data.get("battle_points", 0) + points\n            await query.answer(f"✅ +{points} очков (⚡{speed_bonus} бонус)", show_alert=False)\n        else:\n            await query.answer(f"❌ Верно: {correct_text}", show_alert=True)\n\n        data["current_question"] += 1\n        if data["current_question"] < len(data["questions"]):\n            await send_battle_question(context.bot, chat_id, user_id)\n        else:\n            await finish_battle_for_user(context.bot, chat_id, user_id)\n    finally:\n        active = user_data.get(user_id)\n        if active is data:\n            active["processing_answer"] = False'''),
              ),
              (
                  b('''    battle = get_battle(battle_id)\n    if not battle:\n        await bot.send_message(chat_id=chat_id, text="❌ Битва не найдена.")\n        return\n\n    if role == "creator":\n        update_battle(battle_id, {\n            "creator_score":    data["correct_answers"],\n            "creator_time":     time_taken,\n            "creator_points":   battle_points,\n            "creator_finished": True,\n        })\n    else:\n        update_battle(battle_id, {\n            "opponent_score":    data["correct_answers"],\n            "opponent_time":     time_taken,\n            "opponent_points":   battle_points,\n            "opponent_finished": True,\n        })\n\n    # Перечитываем актуальное состояние из БД\n    battle = get_battle(battle_id)'''),
                  b('''    battle = record_battle_finish_atomic(\n        battle_id, user_id, role,\n        score=data["correct_answers"],\n        time_taken=time_taken,\n        points=battle_points,\n    )\n    if not battle:\n        await bot.send_message(\n            chat_id=chat_id,\n            text="⚠️ Не удалось зафиксировать результат битвы. Нажмите ответ ещё раз для повтора.",\n        )\n        return\n\n    user_data.pop(user_id, None)'''),
              ),
              (
                  b('''    battle_id = query.data.replace("cancel_battle_", "")\n    delete_battle(battle_id)\n    await query.edit_message_text(\n        "❌ Битва отменена.",'''),
                  b('''    battle_id = query.data.replace("cancel_battle_", "")\n    if not cancel_battle_for_participant(battle_id, query.from_user.id):\n        await query.edit_message_text("❌ Битва не найдена или у вас нет права её отменять.")\n        return\n    user_data.pop(query.from_user.id, None)\n    await query.edit_message_text(\n        "❌ Битва отменена.",'''),
              ),
          ]
          current = original
          for old, new in replacements:
              if current.count(old) != 1:
                  raise SystemExit(f"source block count={current.count(old)}")
              if new in current:
                  raise SystemExit("replacement already present")
              current = current.replace(old, new, 1)
          reverse = current
          for old, new in reversed(replacements):
              if reverse.count(new) != 1:
                  raise SystemExit("replacement uniqueness failed")
              reverse = reverse.replace(new, old, 1)
          if reverse != original:
              raise SystemExit("reverse replacement did not reproduce original bytes")
          path.write_bytes(current)
      - name: Verify patch scope
        run: |
          test "$(git diff --name-only)" = "bot.py"
          grep -F 'actual_role = battle_role_for_user(battle, user_id)' bot.py
          grep -F 'battle = record_battle_finish_atomic(' bot.py
          grep -F 'cancel_battle_for_participant(battle_id, query.from_user.id)' bot.py
          grep -F 'active = user_data.get(user_id)' bot.py
      - name: Commit exact handler integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.py
          git commit -m "Enforce PvP participant and finish boundaries"
          git push origin HEAD:agent/bible-bot-battle-consistency
