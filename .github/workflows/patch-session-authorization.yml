name: One-shot session authorization patch

on:
  push:
    branches: [agent/bible-bot-session-authorization]
    paths:
      - .github/workflows/patch-session-authorization.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/bible-bot-session-authorization
          persist-credentials: true
          fetch-depth: 0
      - name: Apply exact byte replacements
        shell: python
        run: |
          from pathlib import Path
          path = Path("bot.py")
          original = path.read_bytes()
          nl = b"\r\n" if b"\r\n" in original else b"\n"
          def b(text):
              return text.replace("\n", nl.decode()).encode()
          replacements = [
              (
                  b('''    # History\n    get_user_history,\n)\nfrom utils import safe_send, safe_edit, safe_truncate, generate_result_image, get_rank_name, create_result_gif'''),
                  b('''    # History\n    get_user_history,\n)\nfrom session_boundaries import (\n    cancel_owned_quiz_session, claim_owned_quiz_session_restart,\n    get_owned_quiz_session,\n)\nfrom utils import safe_send, safe_edit, safe_truncate, generate_result_image, get_rank_name, create_result_gif'''),
              ),
              (
                  b('''    db_session = get_quiz_session(session_id)\n    if not db_session or db_session.get("status") != "in_progress":\n        await query.edit_message_text("⚠️ Сессия не найдена или уже завершена.")\n        return'''),
                  b('''    db_session = get_owned_quiz_session(session_id, user_id)\n    if not db_session:\n        await query.edit_message_text("⚠️ Сессия не найдена, завершена или принадлежит другому пользователю.")\n        return'''),
              ),
              (
                  b('''    db_session = get_quiz_session(session_id)\n    cancel_quiz_session(session_id)\n\n    if not db_session:\n        await query.edit_message_text("⚠️ Сессия не найдена.")\n        return'''),
                  b('''    db_session = claim_owned_quiz_session_restart(session_id, user_id)\n    if not db_session:\n        await query.edit_message_text(\n            "⚠️ Сессия не найдена, уже обработана или принадлежит другому пользователю."\n        )\n        return'''),
              ),
              (
                  b('''async def cancel_session_handler(update: Update, context):\n    query = update.callback_query\n    await query.answer()\n    session_id = query.data.replace("cancel_session_", "")\n    cancel_quiz_session(session_id)\n    await query.edit_message_text("❌ Тест отменён.", reply_markup=_main_keyboard())'''),
                  b('''async def cancel_session_handler(update: Update, context):\n    query = update.callback_query\n    await query.answer()\n    session_id = query.data.replace("cancel_session_", "")\n    user_id = query.from_user.id\n    if not cancel_owned_quiz_session(session_id, user_id):\n        await query.edit_message_text(\n            "⚠️ Сессия не найдена, уже завершена или принадлежит другому пользователю."\n        )\n        return\n    active = user_data.get(user_id)\n    if active and active.get("session_id") == session_id:\n        user_data.pop(user_id, None)\n    await query.edit_message_text("❌ Тест отменён.", reply_markup=_main_keyboard())'''),
              ),
              (
                  b('''    if data_cb.startswith("review_errors_"):\n        # Первый вход: review_errors_{uid}_{idx}\n        parts     = data_cb.split("_")\n        target_id = int(parts[2])\n        index     = int(parts[3])\n    elif data_cb.startswith("review_nav_"):\n        suffix = data_cb.replace("review_nav_", "")\n        if suffix == "noop":\n            return\n        index     = int(suffix)\n        target_id = user_id\n    else:\n        return'''),
                  b('''    try:\n        if data_cb.startswith("review_errors_"):\n            # Первый вход: review_errors_{uid}_{idx}\n            parts = data_cb.split("_")\n            if len(parts) != 4:\n                raise ValueError("invalid review callback")\n            target_id = int(parts[2])\n            index = int(parts[3])\n            if target_id != user_id:\n                await query.edit_message_text("❌ Нет доступа к данным другого пользователя.")\n                return\n        elif data_cb.startswith("review_nav_"):\n            suffix = data_cb.replace("review_nav_", "")\n            if suffix == "noop":\n                return\n            index = int(suffix)\n            target_id = user_id\n        else:\n            return\n    except (TypeError, ValueError):\n        await query.edit_message_text("⚠️ Некорректная кнопка просмотра ошибок.")\n        return'''),
              ),
          ]
          current = original
          for old, new in replacements:
              if current.count(old) != 1:
                  raise SystemExit(f"source block count={current.count(old)}")
              if new in current:
                  raise SystemExit("replacement already present")
              current = current.replace(old, new, 1)
          reverse = current
          for old, new in reversed(replacements):
              if reverse.count(new) != 1:
                  raise SystemExit("replacement uniqueness failed")
              reverse = reverse.replace(new, old, 1)
          if reverse != original:
              raise SystemExit("reverse replacement did not reproduce original bytes")
          path.write_bytes(current)
      - name: Verify patch scope
        run: |
          test "$(git diff --name-only)" = "bot.py"
          grep -F 'db_session = get_owned_quiz_session(session_id, user_id)' bot.py
          grep -F 'db_session = claim_owned_quiz_session_restart(session_id, user_id)' bot.py
          grep -F 'cancel_owned_quiz_session(session_id, user_id)' bot.py
          grep -F 'if target_id != user_id:' bot.py
      - name: Commit exact handler integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.py
          git commit -m "Enforce quiz session callback ownership"
          git push origin HEAD:agent/bible-bot-session-authorization
