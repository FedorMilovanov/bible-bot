name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11.15'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Verify dependency graph
        run: pip check
      - name: Guard tracked tree against secrets
        run: python scripts/check_secrets.py
      - name: Lint maintained Python layer
        run: ruff check web_api keep_alive.py intro.py scripts tests --output-format=github
      - name: Compile Python
        run: python -m compileall -q .
      - name: Run tests
        run: pytest -q
      - name: Check Mini App JavaScript syntax
        run: |
          node --check miniapp/app.js
          node --check miniapp/lifecycle.js
      - name: Build production container
        run: docker build --tag bible-bot-ci .
      - name: Smoke test built web container
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --rm --name bible-bot-ci-web -p 18080:8080 bible-bot-ci python keep_alive.py
          trap 'docker stop bible-bot-ci-web >/dev/null 2>&1 || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent --show-error http://127.0.0.1:18080/live >/tmp/live.json \
              && curl --fail --silent --show-error http://127.0.0.1:18080/ >/tmp/miniapp.html; then
              grep -q '"status":"ok"' /tmp/live.json
              grep -q '<title>Библейский тест — 1 Петра</title>' /tmp/miniapp.html
              exit 0
            fi
            sleep 1
          done
          docker logs bible-bot-ci-web
          exit 1
