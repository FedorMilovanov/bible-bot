name: One-shot bonus contract v3

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/bible-bot-legacy-correctness' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/bible-bot-legacy-correctness
      - name: Apply guarded patch
        run: python .github/scripts/oneshot_bonus_contract_v3.py
      - name: Verify narrow diff
        shell: bash
        run: |
          set -euo pipefail
          changed=$(git diff --name-only)
          test "$changed" = "legacy_result_store.py"
          git diff --check
          grep -q 'def _bonus_stage' legacy_result_store.py
          grep -q 'daily_streak: int | None = None' legacy_result_store.py
          grep -q '"legacy": True' legacy_result_store.py
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add legacy_result_store.py
          git commit -m 'fix: restore replay-stable bonus stage contract'
          git push origin HEAD:agent/bible-bot-legacy-correctness
