name: One-shot random stats key

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/bible-bot-legacy-correctness' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/bible-bot-legacy-correctness
          fetch-depth: 0
      - name: Patch random stats registry exactly
        run: python .github/scripts/oneshot_random_stats_key.py
      - name: Guard database diff
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only)" = "database.py"
          read -r added deleted file < <(git diff --numstat -- database.py)
          test "$file" = "database.py"
          test "$added" = "2"
          test "$deleted" = "2"
          grep -q '"random_all", "random20", "hardcore20"' database.py
          grep -q '"random_all": 1, "random20": 1' database.py
      - name: Commit exact registry fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add database.py
          git commit -m "fix: keep random-all stats out of easy bucket"
          git push origin HEAD:agent/bible-bot-legacy-correctness
