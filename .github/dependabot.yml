version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # PTB 21/22 is a deliberate migration wave: v22 removes APIs deprecated
      # in 20.x and this bot has a large stateful ConversationHandler surface.
      - dependency-name: python-telegram-bot
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
