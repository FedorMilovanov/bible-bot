services:
  - type: web
    name: bible-bot
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python telegram_production.py
    healthCheckPath: /live
    maxShutdownDelaySeconds: 30
    autoDeploy: false
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_USER_ID
        sync: false
      - key: MONGO_URL
        sync: false
      - key: BOT_USERNAME
        sync: false
      - key: APP_ENV
        value: production
      - key: TELEGRAM_INIT_DATA_MAX_AGE_SECONDS
        value: "86400"
      - key: WEB_THREADS
        value: "4"
      - key: MAX_REQUEST_BODY_BYTES
        value: "65536"
      - key: MAX_REQUEST_HEADER_BYTES
        value: "65536"
